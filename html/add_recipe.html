<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recipes - Add Recipe</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900|Material+Icons" rel="stylesheet"
        type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/animate.css@^4.0.0/animate.min.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/quasar@2.18.6/dist/quasar.prod.css" rel="stylesheet" type="text/css">
    <style>
    /* Mobile typography: approximately 2x text size on small screens */
    @media (max-width: 768px) {
      /* Scale base font size so most rem-based text becomes larger */
      html { font-size: 200% !important; }

      /* Ensure Quasar components inherit the larger base size */
      .q-field, .q-field__control, .q-field__native, .q-input__control, .q-input__native,
      .q-select__control, .q-select, .q-btn, .q-item, .q-td, .q-page-container {
        font-size: inherit !important;
        line-height: 1.35 !important;
      }

      /* Make buttons and controls more touch-friendly */
      .q-btn { padding: 12px 18px !important; }
      .q-field__native { min-height: 44px !important; }
      .q-page-container { padding-left: 12px !important; padding-right: 12px !important; }
    }
    </style>
</head>

<body>
    <div id="app">
        <q-layout view="hHh lpR fFf">
            <q-header elevated class="bg-primary text-white" height-hint="98">
                <q-toolbar>
                    <q-toolbar-title>
                        <q-avatar>
                            <img src="https://cdn.quasar.dev/logo-v2/svg/logo-mono-white.svg">
                        </q-avatar>
                        Recipes
                    </q-toolbar-title>
                </q-toolbar>
                <q-tabs align="left">
                    <q-route-tab href="sources.html">Cookbooks</q-route-tab>
                    <q-route-tab href="index.html">All Recipes</q-route-tab>
                    <q-route-tab href="add_recipe.html">Add Recipes</q-route-tab>
                </q-tabs>
            </q-header>
            <q-page-container class="q-pa-md">
                <div v-if="!isLoggedIn" style="text-align: center; padding: 40px 0;">
                    <button @click="handleAuthClick">Sources</button>
                </div>
                <div class="q-pa-md">
                    <div class="row q-col-gutter-md q-row-gutter-md">
                        <div class="col-12 col-md-6">
                            <q-select outlined v-model="selectedSource" label="Cookbook" :options="sOptions" option-label="name"
                                option-value="id" use-input fill-input input-debounce="0" @filter="filterFnSource"
                                @input-value="setModel" hide-selected>
                                <template v-slot:no-option>
                                    <q-item>
                                        <q-item-section class="text-grey">
                                            No results
                                        </q-item-section>
                                    </q-item>
                                </template>
                            </q-select>
                        </div>

                        <div class="col-12 col-md-6">
                            <div v-if="selectedSource && selectedSource.id == -1">
                                <q-input v-model="sourceName" label="Source Name"></q-input>
                            </div>
                        </div>

                        <div class="col-12 col-md-6">
                            <q-file v-model="recipePicture" label="Drop Image Here" outlined multiple append
                                accept=".jpg, image/*" class="q-mb-md">
                            </q-file>
                        </div>

                        <div class="col-12 col-md-6 flex items-center">
                            <q-btn color="primary" text-color="white" label="Pull out details" :loading="loadingGemini"
                                @click="sendToGemini" class="q-mb-md">
                                <template v-slot:loader>
                                    <q-spinner-dots color="white" size="24px" />
                                </template>
                            </q-btn>
                        </div>

                        <div class="col-12 col-sm-6 col-md-3">
                            <q-input v-model="resultSource.name" label="Recipe Name"></q-input>
                        </div>
                        <div class="col-6 col-sm-6 col-md-3">
                            <q-input v-model="resultSource.page_number" label="Page Number"></q-input>
                        </div>
                        <div class="col-6 col-sm-6 col-md-3">
                            <q-input v-model="resultSource.servings" label="Servings"></q-input>
                        </div>
                        <div class="col-6 col-sm-6 col-md-3">
                            <q-input v-model="resultSource.cooking_time_minutes" label="Cooking Time (minutes)"></q-input>
                        </div>
                        <div class="col-12 col-sm-6 col-md-3">
                            <q-input v-model="resultSource.effort_rating" label="Effort Rating (out of 5)"></q-input>
                        </div>

                        <div class="col-12">
                            <div v-if="!isMobile">
                                <q-table flat :rows="resultIngredients" row-key="ingredient" :columns="[
                                    { name: 'amount', label: 'Amount', field: 'amount', align: 'left' },
                                    { name: 'unit', label: 'Unit', field: 'unit', align: 'left' },
                                    { name: 'ingredient', label: 'Ingredient', field: 'ingredient', align: 'left' },
                                    { name: 'original_text', label: 'Original Text', field: 'original_text', align: 'left' }
                                ]" title="Ingredients" rowsPerPage="20" sortBy="ingredient"
                                visible-columns="['amount','unit','ingredient','original_text']" hide-header dense>
                                    <template v-slot:body-cell-amount="props">
                                        <q-td :props="props">
                                            <q-input outlined v-model="props.row.amount" type="number" step="0.01"></q-input>
                                        </q-td>
                                    </template>
                                    <template v-slot:body-cell-unit="props">
                                        <q-td :props="props">
                                            <q-select outlined v-model="props.row.unit" :options="uOptions" option-label="name"
                                                option-value="name" use-input fill-input input-debounce="0" @filter="filterFnUnit"
                                                hide-selected>
                                                <template v-slot:no-option>
                                                    <q-item>
                                                        <q-item-section class="text-grey">
                                                            No results
                                                        </q-item-section>
                                                    </q-item>
                                                </template>
                                            </q-select>
                                        </q-td>
                                    </template>
                                    <template v-slot:body-cell-ingredient="props">
                                        <q-td :props="props">
                                            <q-select outlined v-model="props.row.ingredient" :options="iOptions"
                                                option-label="name" option-value="name" use-input fill-input input-debounce="0"
                                                @filter="filterFnIngredient" hide-selected>
                                                <template v-slot:no-option>
                                                    <q-item>
                                                        <q-item-section class="text-grey">
                                                            No results
                                                        </q-item-section>
                                                    </q-item>
                                                </template>
                                            </q-select>
                                        </q-td>
                                    </template>
                                    <template v-slot:body-cell-original_text="props">
                                        <q-td :props="props">
                                            <q-input outlined v-model="props.row.original_text"></q-input>
                                        </q-td>
                                    </template>
                                </q-table>
                            </div>

                            <div v-else class="column q-gutter-md">
                                <div v-for="(ing, idx) in resultIngredients" :key="idx" class="q-pa-sm bg-grey-1 q-rounded">
                                    <div class="row q-col-gutter-sm q-row-gutter-xs">
                                        <div class="col-5">
                                            <q-input outlined dense v-model="ing.amount" type="number" step="0.01" label="Amount"></q-input>
                                        </div>
                                        <div class="col-7">
                                            <q-select outlined dense v-model="ing.unit" :options="uOptions" option-label="name" option-value="name" label="Unit" use-input hide-selected></q-select>
                                        </div>
                                        <div class="col-12">
                                            <q-select outlined dense v-model="ing.ingredient" :options="iOptions" option-label="name" option-value="name" label="Ingredient" use-input hide-selected></q-select>
                                        </div>
                                        <div class="col-12">
                                            <q-input outlined dense v-model="ing.original_text" label="Original Text"></q-input>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <div v-if="!isMobile">
                                <q-table flat :rows="resultSteps" row-key="step" :columns="[
                                        { name: 'step', label: 'Step', field: 'step', align: 'left' },
                                        { name: 'instruction', label: 'Instruction', field: 'instruction', align: 'left' }
                                    ]" title="Steps" rowsPerPage="20" sortBy="step" visible-columns="['step','instruction']"
                                    hide-header dense>
                                    <template v-slot:body-cell-instruction="props">
                                        <q-td :props="props">
                                            <q-input outlined v-model="props.row.instruction"></q-input>
                                        </q-td>
                                    </template>
                                </q-table>
                            </div>

                            <div v-else class="column q-gutter-md">
                                <div v-for="(st, idx) in resultSteps" :key="idx" class="q-pa-sm bg-grey-1 q-rounded">
                                    <q-input outlined dense v-model="st.instruction" :label="'Step ' + (st.step || (idx+1))"></q-input>
                                </div>
                            </div>
                        </div>
                    </div>
            </q-page-container>
        </q-layout>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quasar@2.18.6/dist/quasar.umd.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quasar@2.18.6/dist/lang/en-GB.umd.prod.js"></script>

    <script>
        const sourceOptions = []
        const unitOptions = []
        const ingredientOptions = []
        const { createApp, ref, onMounted, onBeforeUnmount } = Vue;
        const app = Vue.createApp({
            setup() {
                // !!! REPLACE THESE TWO VALUES !!!
                const CLIENT_ID = '872552222655-gu78ic30706c6164v8st2hu67vj36vhn.apps.googleusercontent.com';
                const PROJECT_ID = 'recipes-46d2e';
                const searchText = ref('');
                const isLoggedIn = ref(false);
                const loadingIngredient = ref(false);
                const loadingSource = ref(false);
                const loadingUnit = ref(false);
                const errorIngredient = ref(null);
                const errorSource = ref(null);
                const errorUnit = ref(null);
                const rows = ref([]);
                const iSchema = ref([]);
                const uSchema = ref([]);
                const sSchema = ref([]);
                const selectedSource = ref(null);
                const selectedUnit = ref(null);
                const selectedIngredient = ref(null);
                const model = ref(null)
                const sOptions = ref(sourceOptions)
                const uOptions = ref(unitOptions)
                const iOptions = ref(ingredientOptions)
                const recipePicture = ref(null)
                const loadingGemini = ref(false)
                const recipeDetails = ref(false)
                const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`;
                const resultSource = ref({})
                const resultIngredients = ref([])
                const resultSteps = ref([])
                const sourceName = ref ('');
                let tokenClient;
                let mq = null;
                let mqListener = null;
                const isMobile = ref(window.matchMedia ? window.matchMedia('(max-width: 768px)').matches : false);

                // Initialize Google Identity Services

                onMounted(() => {
                    const initGis = () => {
                        const cachedToken = localStorage.getItem('bq_token');
                        const tokenTime = localStorage.getItem('bq_token_time');
                        const oneHour = 3600 * 1000;
                        tokenClient = google.accounts.oauth2.initTokenClient({
                            client_id: CLIENT_ID,
                            scope: 'https://www.googleapis.com/auth/bigquery https://www.googleapis.com/auth/generative-language.retriever',
                            callback: (resp) => {
                                if (resp.access_token) {
                                    localStorage.setItem('bq_token', resp.access_token);
                                    localStorage.setItem('bq_token_time', Date.now())
                                    isLoggedIn.value = true;
                                    executeTemplate();
                                } else if (resp.error === 'interaction_required') {
                                    // This is expected if the user needs to click a button
                                    console.log("Silent auth failed: User interaction required.");
                                    isLoggedIn.value = false;
                                }
                            },
                        });
                        if (cachedToken && (Date.now() - tokenTime < oneHour)) {
                            // Token is still fresh! No popup needed.
                            console.log('win')
                            isLoggedIn.value = true;
                            executeTemplate();
                        } else {
                            // Token is missing or expired. 
                            // We MUST ask the user to click the button or try one silent check.
                            tokenClient.requestAccessToken();
                        }
                    };

                    if (window.google) initGis();
                    else window.onload = initGis;

                    // Setup mobile media query listener
                    mq = window.matchMedia('(max-width: 768px)');
                    mqListener = (e) => { isMobile.value = e.matches; };
                    if (mq.addEventListener) mq.addEventListener('change', mqListener);
                    else mq.addListener(mqListener);
                    isMobile.value = mq.matches;
                });

                onBeforeUnmount(() => {
                    if (mq) {
                        if (mq.removeEventListener) mq.removeEventListener('change', mqListener);
                        else mq.removeListener(mqListener);
                    }
                });

                const handleAuthClick = () => tokenClient.requestAccessToken();

                const logout = () => {
                    localStorage.removeItem('bq_token');
                    isLoggedIn.value = false;
                    rows.value = [];
                };

                const executeTemplate = async () => {
                    const token = localStorage.getItem('bq_token');
                    if (!token) return;

                    loadingSource.value = true;
                    errorSource.value = null;
                    loadingUnit.value = true;
                    errorUnit.value = null;
                    loadingIngredient.value = true;
                    errorIngredient.value = null;
                    try {
                        const responseSource = await fetch(`https://bigquery.googleapis.com/bigquery/v2/projects/${PROJECT_ID}/queries`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                query: "SELECT source_id, source_name from `recipes-46d2e.recipes.sources` order by source_name",
                                useLegacySql: false
                            })
                        });

                        const data = await responseSource.json();

                        if (data.error) {
                            if (data.error.code === 401) logout();
                            else throw new Error(data.error.message);
                        } else {
                            sSchema.value = data.schema.fields;
                            const mappedRows = data.rows.map(function (row) {
                                return {
                                    id: row.f[0]?.v || -1, name: row.f[1]?.v || 'N/A'
                                }
                            }) || [];
                            mappedRows.push({ id: -1, name: 'New Cookbook' })
                            sourceOptions.push(...mappedRows)
                            selectedSource.value = sourceOptions[0];
                        }
                    } catch (e) {
                        errorSource.value = e.message;
                    } finally {
                        loadingSource.value = false;
                    }
                    try {
                        const responseUnit = await fetch(`https://bigquery.googleapis.com/bigquery/v2/projects/${PROJECT_ID}/queries`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                query: "SELECT unit_id, unit_name from `recipes-46d2e.recipes.units`",
                                useLegacySql: false
                            })
                        });

                        const unitData = await responseUnit.json();

                        if (unitData.error) {
                            if (unitData.error.code === 401) logout();
                            else throw new Error(unitData.error.message);
                        } else {
                            uSchema.value = unitData.schema.fields;
                            const unitMappedRows = unitData.rows.map(function (row) {
                                return {
                                    id: row.f[0]?.v || -1, name: row.f[1]?.v || 'N/A'
                                }
                            }) || [];
                            unitOptions.push(...unitMappedRows);
                        }
                    } catch (e) {
                        errorUnit.value = e.message;
                    } finally {
                        loadingUnit.value = false;
                    }
                    try {
                        const responseIngredients = await fetch(`https://bigquery.googleapis.com/bigquery/v2/projects/${PROJECT_ID}/queries`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                query: "SELECT ingredient_id, ingredient_name from `recipes-46d2e.recipes.ingredients`",
                                useLegacySql: false
                            })
                        });

                        const ingredientData = await responseIngredients.json();

                        if (ingredientData.error) {
                            console.log('fail')
                            if (ingredientData.error.code === 401) logout();
                            else throw new Error(ingredientData.error.message);
                        } else {
                            iSchema.value = ingredientData.schema.fields;
                            const ingredientMappedRows = ingredientData.rows.map(function (row) {
                                return {
                                    id: row.f[0]?.v || -1, name: row.f[1]?.v || 'N/A'
                                }
                            }) || [];
                            ingredientOptions.push(...ingredientMappedRows);
                        }
                    } catch (e) {
                        errorIngredient.value = e.message;
                    } finally {
                        loadingIngredient.value = false;
                    }

                };

                const sendToGemini = async () => {
                    loadingGemini.value = true;
                    const token = localStorage.getItem('bq_token');

                    // 1. Loop through all files and convert to base64
                    const fileParts = await Promise.all(
                        recipePicture.value.map(async (file) => {
                            const base64Data = await new Promise((resolve) => {
                                const reader = new FileReader();
                                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                                reader.readAsDataURL(file);
                            });

                            return {
                                inline_data: {
                                    mime_type: file.type,
                                    data: base64Data
                                }
                            };
                        })
                    );
                    const text = `Extract data from the provided image into exactly 3 separate JSON objects. 

### CONSTRAINTS:
- Any mention of 'a couple' means 2
- Do not nest these into a single root object.
- Use decimal format for all numbers.
- SERVINGS: If a range is provided (e.g., "4-6"), take the LOWEST value.
- COOKING TIME: Provide the total time in minutes, ensuring it INCLUDES prep work (chopping, marinating, kneading) and active cooking time. 
- If a time range is provided (e.g., "20-30 mins"), take the HIGHEST value.
- If marinating time is "overnight," assume 0 minutes for that portion.
- EFFORT RATING: Provide an indicative effort rating out of 5 based on complexity (allow halves, e.g., 3.5).
- For ingredients: use singular nouns, remove prep (e.g., 'lamb' not 'ground lamb'), but keep 'Black Pepper', 'White Pepper', and 'Bell Pepper'.
- If a unit or ingredient is not in the provided lists, use {"id": -1, "name": "extracted name"}.

### OUTPUT SCHEMA:
1. METADATA OBJECT:
{ 
  "name": string, 
  "servings": number, 
  "page_number": number,
  "cooking_time_minutes": number,
  "effort_rating": number
}

2. INGREDIENTS ARRAY:
An array where each item is:
{
  "amount": number,
  "unit": { "id": number, "name": string },
  "ingredient": { "id": number, "name": string },
  "original_text": string
}
- Use these Units: ` + JSON.stringify(unitOptions)  + `
- Use these Ingredients: ` + JSON.stringify(ingredientOptions) + `

3. STEPS ARRAY:
An array where each item is: { "step": number, "instruction": string }

Return these as three distinct markdown code blocks.`;

                    JSON.stringify(unitOptions) + " ingredients to the json object " + JSON.stringify(ingredientOptions) + ". If these are matched, replace the unit or ingredient element in the json with the matched key/value pair. Otherwise, add them as {id: -1, name: ingredient}. JSON3 - Extract the steps in order and number them if they are not already - return these as 'step' and 'instruction'";
                    console.log(text);
                    // 2. Combine your text and images into the parts array
                    const payload = {
                        contents: [{
                            parts: [
                                { text: text }, // Your prompt
                                ...fileParts // This spreads all converted images into the parts array
                            ]
                        }]
                    };
                    console.log(payload)
                    // 3. Send to Gemini
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json',
                            'x-goog-user-project': PROJECT_ID
                        },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    console.log(result)
                    const resultString = result.candidates[0].content.parts[0].text;
                    const jsonBlocks = [];
                    const regex = /```json\s?([\s\S]*?)```/g;
                    let match
                    while ((match = regex.exec(resultString)) !== null) {
                        jsonBlocks.push(match[1].trim());
                    }
                    try {
                        console.log(jsonBlocks[0]);
                        console.log(jsonBlocks[1]);
                        console.log(jsonBlocks[2]);
                        const source = jsonBlocks[0] ? JSON.parse(jsonBlocks[0]) : {};
                        const ingredients = jsonBlocks[1] ? JSON.parse(jsonBlocks[1]) : [];
                        const steps = jsonBlocks[2] ? JSON.parse(jsonBlocks[2]) : [];
                        const newIngredients = ingredients.filter((row) => row.ingredient.id == -1).map(row => row.ingredient);
                        const newIngredientsToAdd = newIngredients.filter((item, index, self) =>
                            index === self.findIndex((t) => (
                                t.id === item.id && t.name === item.name
                            ))
                        );
                        ingredientOptions.push(...newIngredientsToAdd);
                        resultSource.value = source
                        resultIngredients.value = ingredients
                        resultSteps.value = steps;
                        loadingGemini.value = false;
                    } catch (e) {
                        console.error("Failed to parse JSON blocks. Check for trailing commas or markdown errors.", e);
                        return null;
                    }
                };

                return {
                    model,
                    isMobile,
                    sOptions,
                    uOptions,
                    iOptions,
                    isLoggedIn,
                    loadingIngredient,
                    loadingSource,
                    loadingUnit,
                    errorIngredient,
                    errorSource,
                    errorUnit,
                    rows,
                    sSchema,
                    iSchema,
                    uSchema,
                    handleAuthClick,
                    logout,
                    executeTemplate,
                    searchText,
                    selectedSource,
                    selectedUnit,
                    selectedIngredient,
                    recipePicture,
                    loadingGemini,
                    recipeDetails,
                    resultSource,
                    resultIngredients,
                    resultSteps,
                    sourceName,
                    filterFnSource(val, update, abort) {
                        update(() => {
                            const needle = val.toLocaleLowerCase()
                            sOptions.value = sourceOptions.filter(v => v.name.toLocaleLowerCase().indexOf(needle) > -1)
                        })
                    },
                    filterFnUnit(val, update, abort) {
                        update(() => {
                            const needle = val.toLocaleLowerCase()
                            uOptions.value = unitOptions.filter(v => v.name.toLocaleLowerCase().indexOf(needle) > -1)
                        })
                    },
                    filterFnIngredient(val, update, abort) {
                        update(() => {
                            const needle = val.toLocaleLowerCase()
                            iOptions.value = ingredientOptions.filter(v => v.name.toLocaleLowerCase().indexOf(needle) > -1)
                        })
                    },
                    setModel(val) {
                        model.value = val
                    },
                    sendToGemini
                }
            }
        });

        app.use(Quasar)
        Quasar.Lang.set(Quasar.Lang.enGB)
        app.mount('#app')
    </script>

</body>

</html>
