<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Recipes - Add Recipe</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900|Material+Icons" rel="stylesheet"
        type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/animate.css@^4.0.0/animate.min.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/quasar@2.18.6/dist/quasar.prod.css" rel="stylesheet" type="text/css">
</head>

<body>
    <div id="app">
        <q-layout view="hHh lpR fFf">
            <q-header elevated class="bg-primary text-white" height-hint="98">
                <q-toolbar>
                    <q-toolbar-title>
                        <q-avatar>
                            <img src="https://cdn.quasar.dev/logo-v2/svg/logo-mono-white.svg">
                        </q-avatar>
                        Recipes
                    </q-toolbar-title>
                </q-toolbar>
                <q-tabs align="left">
                    <q-route-tab href="sources.html">Cookbooks</q-route-tab>
                    <q-route-tab href="index.html">All Recipes</q-route-tab>
                    <q-route-tab href="add_recipe.html">Add Recipes</q-route-tab>
                </q-tabs>
            </q-header>
            <q-page-container class="qa-pa-md">
                <div v-if="!isLoggedIn" style="text-align: center; padding: 40px 0;">
                    <button @click="handleAuthClick">Sources</button>
                </div>
                <div class="q-pa-md" v-else>
                    <q-select outlined v-model="selectedSource" label="Cookbook" :options="sOptions" option-label="name"
                        option-value="id" use-input fill-input input-debounce="0" @filter="filterFnSource"
                        @input-value="setModel" hide-selected>
                        <template v-slot:no-option>
                            <q-item>
                                <q-item-section class="text-grey">
                                    No results
                                </q-item-section>
                            </q-item>
                        </template>
                    </q-select>
                    <q-file v-model="recipePicture" label="Drop Image Here" outlined multiple append
                        accept=".jpg, image/*">
                    </q-file>
                    <q-btn color="primary" text-color="white" label="Pull out details" :loading="loadingGemini"
                        @click="sendToGemini"></q-btn>
                    <q-input v-model="resultSource.name" label="Recipe Name"></q-input>
                    <q-input v-model="resultSource.page_number" label="Page Number"></q-input>
                    <q-input v-model="resultSource.servings" label="Servings"></q-input>
                    <q-table
                        flat
                        :rows="resultIngredients"
                        row-key="ingredient"
                        :columns="[
                            { name: 'amount', label: 'Amount', field: 'amount', align: 'left' },
                            { name: 'unit', label: 'Unit', field: 'unit', align: 'left' },
                            { name: 'ingredient', label: 'Ingredient', field: 'ingredient', align: 'left' },
                            { name: 'original_text', label: 'Original Text', field: 'original_text', align: 'left' }
                        ]"
                        title="Ingredients"
                        rowsPerPage ="20"
                        sortBy="ingredient"
                        visible-columns="['amount','unit','ingredient','original_text']"
                        hide-header
                        dense
                    ></q-table>
                    <q-table
                        flat
                        :rows="resultSteps"
                        row-key="step"
                        :columns="[
                            { name: 'step', label: 'Step', field: 'step', align: 'left' },
                            { name: 'instruction', label: 'Instruction', field: 'instruction', align: 'left' }
                        ]"
                        title="Steps"
                        rowsPerPage ="20"
                        sortBy="step"
                        visible-columns="['step','instruction']"
                        hide-header
                        dense
                    ></q-table>
                </div>
            </q-page-container>
        </q-layout>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quasar@2.18.6/dist/quasar.umd.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quasar@2.18.6/dist/lang/en-GB.umd.prod.js"></script>

    <script>
        const sourceOptions = []
        const unitOptions = []
        const ingredientOptions = []
        const { createApp, ref, onMounted } = Vue;
        const app = Vue.createApp({
            setup() {
                // !!! REPLACE THESE TWO VALUES !!!
                const CLIENT_ID = '872552222655-gu78ic30706c6164v8st2hu67vj36vhn.apps.googleusercontent.com';
                const PROJECT_ID = 'recipes-46d2e';
                const searchText = ref('');
                const isLoggedIn = ref(false);
                const loading = ref(false);
                const error = ref(null);
                const rows = ref([]);
                const schema = ref([]);
                const selectedSource = ref(null);
                const model = ref(null)
                const sOptions = ref(sourceOptions)
                const uOptions = ref(unitOptions)
                const iOptions = ref(ingredientOptions)
                const recipePicture = ref(null)
                const loadingGemini = ref(false)
                const recipeDetails = ref(false)
                const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`;
                const resultSource = ref({})
                const resultIngredients = ref ([])
                const resultSteps = ref ([])
                let tokenClient;

                // Initialize Google Identity Services

                onMounted(() => {
                    const initGis = () => {
                        const cachedToken = localStorage.getItem('bq_token');
                        const tokenTime = localStorage.getItem('bq_token_time');
                        const oneHour = 3600 * 1000;
                        tokenClient = google.accounts.oauth2.initTokenClient({
                            client_id: CLIENT_ID,
                            scope: 'https://www.googleapis.com/auth/bigquery https://www.googleapis.com/auth/generative-language.retriever',
                            callback: (resp) => {
                                if (resp.access_token) {
                                    localStorage.setItem('bq_token', resp.access_token);
                                    localStorage.setItem('bq_token_time', Date.now())
                                    isLoggedIn.value = true;
                                    executeTemplate();
                                } else if (resp.error === 'interaction_required') {
                                    // This is expected if the user needs to click a button
                                    console.log("Silent auth failed: User interaction required.");
                                    isLoggedIn.value = false;
                                }
                            },
                        });
                        if (cachedToken && (Date.now() - tokenTime < oneHour)) {
                            // Token is still fresh! No popup needed.
                            console.log('win')
                            isLoggedIn.value = true;
                            executeTemplate();
                        } else {
                            // Token is missing or expired. 
                            // We MUST ask the user to click the button or try one silent check.
                            tokenClient.requestAccessToken();
                        }
                    };

                    if (window.google) initGis();
                    else window.onload = initGis;
                });

                const handleAuthClick = () => tokenClient.requestAccessToken();

                const logout = () => {
                    localStorage.removeItem('bq_token');
                    isLoggedIn.value = false;
                    rows.value = [];
                };

                const executeTemplate = async () => {
                    const token = localStorage.getItem('bq_token');
                    if (!token) return;

                    loading.value = true;
                    error.value = null;
                    const bqHeader = {'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json'};
                    const bqUrl = `https://bigquery.googleapis.com/bigquery/v2/projects/${PROJECT_ID}/queries`;
                    try {
                        const responseSource = await fetch(bqUrl, {
                            method: 'POST',
                            headers: bqHeader,
                            body: JSON.stringify({
                                query: "SELECT source_id, source_name from `recipes-46d2e.recipes.sources`",
                                useLegacySql: false
                            })
                        });
                        
                        const data = await responseSource.json();

                        if (data.error) {
                            if (data.error.code === 401) logout();
                            else throw new Error(data.error.message);
                        } else {
                            schema.value = data.schema.fields;
                            const mappedRows = data.rows.map(function (row) {
                                return {
                                    id: row.f[0]?.v || -1, name: row.f[1]?.v || 'N/A'
                                }
                            }) || [];
                            mappedRows.push({ id: -1, name: 'New Cookbook' })
                            sourceOptions = mappedRows;
                        }
                    } catch (e) {
                        error.value = e.message;
                    } finally {
                        loading.value = false;
                    }
                    try {
                        const responseSource = await fetch(bqUrl, {
                            method: 'POST',
                            headers: bqHeader,
                            body: JSON.stringify({
                                query: "SELECT unit_id, unit_name from `recipes-46d2e.recipes.units`",
                                useLegacySql: false
                            })
                        });
                        
                        const data = await responseSource.json();

                        if (data.error) {
                            if (data.error.code === 401) logout();
                            else throw new Error(data.error.message);
                        } else {
                            schema.value = data.schema.fields;
                            const mappedRows = data.rows.map(function (row) {
                                return {
                                    id: row.f[0]?.v || -1, name: row.f[1]?.v || 'N/A'
                                }
                            }) || [];
                            mappedRows.push({ id: -1, name: 'New New Unit' })
                            unitOptions = mappedRows;
                        }
                    } catch (e) {
                        error.value = e.message;
                    } finally {
                        loading.value = false;
                    }
                    try {
                        const responseSource = await fetch(bqUrl, {
                            method: 'POST',
                            headers: bqHeader,
                            body: JSON.stringify({
                                query: "SELECT ingredient_id, ingredient_name from `recipes-46d2e.recipes.ingredients`",
                                useLegacySql: false
                            })
                        });
                        
                        const data = await responseSource.json();

                        if (data.error) {
                            if (data.error.code === 401) logout();
                            else throw new Error(data.error.message);
                        } else {
                            schema.value = data.schema.fields;
                            const mappedRows = data.rows.map(function (row) {
                                return {
                                    id: row.f[0]?.v || -1, name: row.f[1]?.v || 'N/A'
                                }
                            }) || [];
                            mappedRows.push({ id: -1, name: 'New New Unit' })
                            ingredientOptions = mappedRows;
                        }
                    } catch (e) {
                        error.value = e.message;
                    } finally {
                        loading.value = false;
                    }

                };

                const sendToGemini = async () => {
                    const token = localStorage.getItem('bq_token');

                    // 1. Loop through all files and convert to base64
                    const fileParts = await Promise.all(
                        recipePicture.value.map(async (file) => {
                            const base64Data = await new Promise((resolve) => {
                                const reader = new FileReader();
                                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                                reader.readAsDataURL(file);
                            });

                            return {
                                inline_data: {
                                    mime_type: file.type,
                                    data: base64Data
                                }
                            };
                        })
                    );

                    // 2. Combine your text and images into the parts array
                    const payload = {
                        contents: [{
                            parts: [
                                { text: "Please provide 3 JSON objects from these images as follows. 1 - Extract the name of the recipe as 'name', the number of servings as 'servings' and the page number of the first page as 'page_number' if available. 2 - Extract the ingredients  and return them as a JSON with amount, unit, ingredient and original text. Ensure all numbers are in decimal format.Use the text 'item' if no unit specified, and please return ingredients without any preparation (e.g. ground) and as the singular noun (e.g. 'sausage' not 'sausages') 'Black Pepper' and 'White Pepper' are to be kept with the colour description, and 'Bell Pepper' must also stay the same. Attempt to match units to the json object " + JSON.stringify(unitOptions) + " ingredients to the json object" + json.stringify(ingredientOptions) +". If these are matched, replace the unit or ingredient element in the json with the matched key/value pair. Otherwise, add them as {id: -1, name: ingredient}.3 - Extract the steps in order and number them if they are not already - return these as 'step' and 'instruction'" }, // Your prompt
                                ...fileParts // This spreads all converted images into the parts array
                            ]
                        }]
                    };

                    // 3. Send to Gemini
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json',
                            'x-goog-user-project': PROJECT_ID
                        },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    const resultString = result.candidates[0].content.parts[0].text;
                    const jsonBlocks = [];
                    const regex = /```json\s?([\s\S]*?)```/g;
                    let match
                    while ((match = regex.exec(resultString)) !== null) {
                        jsonBlocks.push(match[1].trim());
                    }
                    try {
                        const source = jsonBlocks[0] ? JSON.parse(jsonBlocks[0]) : {};
                        const ingredients = jsonBlocks[1] ? JSON.parse(jsonBlocks[1]) : [];
                        const steps = jsonBlocks[2] ? JSON.parse(jsonBlocks[2]) : [];
                        resultSource.value = source
                        resultIngredients.value = ingredients
                        resultSteps.value = steps;      
                    } catch (e) {
                        console.error("Failed to parse JSON blocks. Check for trailing commas or markdown errors.", e);
                        return null;
                    }
                };

                return {
                    model,
                    sOptions,
                    uOptions,
                    iOptions,
                    isLoggedIn,
                    loading,
                    error,
                    rows,
                    schema,
                    handleAuthClick,
                    logout,
                    executeTemplate,
                    searchText,
                    selectedSource,
                    recipePicture,
                    loadingGemini,
                    recipeDetails,
                    resultSource,
                    resultIngredients,
                    resultSteps,
                    filterFnSource(val, update, abort) {
                        update(() => {
                            const needle = val.toLocaleLowerCase()
                            sOptions.value = sourceOptions.filter(v => v.name.toLocaleLowerCase().indexOf(needle) > -1)
                        })
                    },
                    filterFnUnit(val, update, abort) {
                        update(() => {
                            const needle = val.toLocaleLowerCase()
                            uOptions.value = unitOptions.filter(v => v.name.toLocaleLowerCase().indexOf(needle) > -1)
                        })
                    },
                    filterFnIngredient(val, update, abort) {
                        update(() => {
                            const needle = val.toLocaleLowerCase()
                            iOptions.value = ingredientOptions.filter(v => v.name.toLocaleLowerCase().indexOf(needle) > -1)
                        })
                    },
                    setModel(val) {
                        model.value = val
                    },
                    sendToGemini
                }
            }
        });

        app.use(Quasar)
        Quasar.Lang.set(Quasar.Lang.enGB)
        app.mount('#app')
    </script>

</body>

</html>
