<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recipes - All Recipes</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900|Material+Icons" rel="stylesheet"
        type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/animate.css@^4.0.0/animate.min.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/quasar@2.18.6/dist/quasar.prod.css" rel="stylesheet" type="text/css">
    <style>
    /* Mobile typography: approximately 2x text size on small screens */
    @media (max-width: 768px) {
      /* Scale base font size so most rem-based text becomes larger */
      html { font-size: 200% !important; }

      /* Ensure Quasar components inherit the larger base size */
      .q-field, .q-field__control, .q-field__native, .q-input__control, .q-input__native,
      .q-select__control, .q-select, .q-btn, .q-item, .q-td, .q-page-container {
        font-size: inherit !important;
        line-height: 1.35 !important;
      }

      /* Make buttons and controls more touch-friendly */
      .q-btn { padding: 12px 18px !important; }
      .q-field__native { min-height: 44px !important; }
      .q-page-container { padding-left: 12px !important; padding-right: 12px !important; }
    }

    /* Match table row text to the table title (uses rems so it scales with mobile font-size) */
    .q-table__title { font-size: 1.25rem; font-weight: 500; }
    .q-table .q-td, .q-table .q-td a { font-size: 1.25rem; }
    .table-row-title { font-size: 1.25rem; }

    /* On small screens, counter the doubled base font-size so table text visually matches desktop */
    @media (max-width: 768px) {
      .q-table__title, .q-table .q-td, .q-table .q-td a, .table-row-title {
        font-size: 0.625rem !important; /* 1.25rem / 2 to cancel html{font-size:200%} */
        font-weight: 500 !important;
      }
    }

    </style>
</head>

<body>
    <div id="app">
        <q-layout view="hHh lpR fFf">
            <q-header elevated class="bg-primary text-white" height-hint="98">
                <q-toolbar>
                    <q-toolbar-title>
                        <q-avatar>
                            <img src="https://cdn.quasar.dev/logo-v2/svg/logo-mono-white.svg">
                        </q-avatar>
                        Recipes
                    </q-toolbar-title>
                </q-toolbar>
                <q-tabs align="left">
                    <q-route-tab href="sources.html">Cookbooks</q-route-tab>
                    <q-route-tab href="index.html">All Recipes</q-route-tab>
                    <q-route-tab href="add_recipe.html">Add Recipes</q-route-tab>
                </q-tabs>
            </q-header>
            <q-page-container class="q-pa-md">                             
                <div v-if="!isLoggedIn" style="text-align: center; padding: 40px 0;">
                    <button @click="handleAuthClick">Sources</button>
                </div>                
                <div class="q-pa-md" v-else>
                    <div v-if="!isMobile" class="row q-col-gutter-md q-row-gutter-md">
                        <div class="col-12">
                            <q-table
                                flat
                                :rows="rows"
                                row-key="id"
                                :columns="[
                                    { name: 'id', label: 'ID', field: 'recipe_id', align: 'left' },
                                    { name: 'name', label: 'Recipe Name', field: 'name', align: 'left' },
                                    { name: 'source', label: 'Source Name', field: 'source_name', align: 'left' },
                                    { name: 'page', label: 'Pages', field: 'page', align: 'left' },
                                    { name: 'cooking_time_minutes', label: 'Cooking Time (mins)', field: 'cooking_time_minutes', align: 'left' },
                                    { name: 'effort_rating', label: 'Effort Rating', field: 'effort_rating', align: 'left' }
                                ]"
                                title="Recipes"
                                rowsPerPage ="20"
                                sortBy="name"
                                visible-columns="['name']"
                                :filter="searchText"
                                hide-header
                                dense
                            >
                        <template v-slot:top-right>
                            <q-input borderless dense debounce="300" v-model="searchText" placeholder="Search">
                            <template v-slot:append>
                                <q-icon name="search" />
                            </template>
                            </q-input>
                        </template>
                        <template v-slot:body="props">
                            <q-tr :props="props">
                                <q-td key="name" :props="props"></q-td>
                                    <div class="q-pa-md q-gutter-sm">
                                        <a :href="'recipe.html?id=' + props.row.id">{{props.row.name}}</a>
                                        <q-chip size="sm" icon="menu_book" text-color="white" color="purple" v-if="props.row.page">
                                            {{ props.row.source_name }} p.{{ props.row.page}}
                                        </q-chip>
                                        <q-chip size="sm" icon="language" text-color="white" color="purple" v-else>
                                            {{ props.row.source_name }}
                                        </q-chip>
                                        <q-chip size="sm" icon="schedule" text-color="white" color="purple">
                                            {{ props.row.cooking_time_minutes }} mins
                                        </q-chip>
                                        <q-chip size="sm" text-color="white" color="purple">
                                            Difficulty: <q-rating v-model="props.row.effort_rating" size="1.5em" color="white" readonly></q-rating>                                            
                                        </q-chip>
                                    </div>
                                </q-td>
                            </q-tr>
                        </template>
                            </q-table>
                        </div>
                    </div>

                    <div v-else class="column q-gutter-md">
                        <q-input borderless dense debounce="300" v-model="searchText" placeholder="Search">
                            <template v-slot:append>
                                <q-icon name="search" />
                            </template>
                        </q-input>
                        <div v-for="(r, idx) in rows.filter(r => (r.name || '').toLowerCase().includes((searchText || '').toLowerCase()))" :key="r.id" class="q-pa-sm bg-grey-1 q-rounded">
                            <div class="row items-center">
                                <div class="col">
                                    <a :href="'recipe.html?id=' + r.id" class="text-primary text-weight-medium table-row-title">{{ r.name }}</a>
                                    <div class="text-primary text-weight-medium table-row-title text-grey">
                                        {{r.source_name}}<span v-if="r.page">, p.{{ r.page }}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </q-page-container>
        </q-layout>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quasar@2.18.6/dist/quasar.umd.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quasar@2.18.6/dist/lang/en-GB.umd.prod.js"></script>

    <script>
        const { createApp, ref, onMounted, onBeforeUnmount } = Vue;

        const app = Vue.createApp({
            setup() {
                // !!! REPLACE THESE TWO VALUES !!!
                const CLIENT_ID = '872552222655-gu78ic30706c6164v8st2hu67vj36vhn.apps.googleusercontent.com';
                const PROJECT_ID = 'recipes-46d2e';
                const columns = []/*[
                    {name: 'id', label: '', field: row => row.f[0].v, align: 'left', sortable: true},
                    {name: 'recipe', label: '', field: row => row.f[1].v, align: 'left', sortable: true}
                ]|*/
                const isLoggedIn = ref(false);
                const loading = ref(false);
                const error = ref(null);
                const rows = ref([]);
                const schema = ref([]);
                const searchText = ref('');

                // mobile watcher: mirrors add_recipe behaviour
                const isMobile = ref(false);
                let mq = null;
                let mqListener = null;

                let tokenClient;
                const params = new Proxy(new URLSearchParams(window.location.search), {
                    get: (searchParams, prop) => searchParams.get(prop),
                });
                // Initialize Google Identity Services

                onMounted(() => {
                    const initGis = () => {
                        const cachedToken = localStorage.getItem('bq_token');
                        const tokenTime = localStorage.getItem('bq_token_time');
                        const oneHour = 3600 * 1000;
                        tokenClient = google.accounts.oauth2.initTokenClient({
                            client_id: CLIENT_ID,
                            scope: 'https://www.googleapis.com/auth/bigquery https://www.googleapis.com/auth/generative-language.retriever',
                            callback: (resp) => {
                                if (resp.access_token) {
                                    localStorage.setItem('bq_token', resp.access_token);
                                    localStorage.setItem('bq_token_time', Date.now())
                                    isLoggedIn.value = true;
                                    executeTemplate();
                                } else if (resp.error === 'interaction_required') {
                                    // This is expected if the user needs to click a button
                                    console.log("Silent auth failed: User interaction required.");
                                    isLoggedIn.value = false;
                                }
                            },
                        });
                        if (cachedToken && (Date.now() - tokenTime < oneHour)) {
                            // Token is still fresh! No popup needed.
                            isLoggedIn.value = true;
                            executeTemplate();
                        } else {
                            // Token is missing or expired. 
                            // We MUST ask the user to click the button or try one silent check.
                            tokenClient.requestAccessToken();
                        }
                    };

                    if (window.google) initGis();
                    else window.onload = initGis;

                    // Setup mobile media query listener (same pattern as add_recipe)
                    mq = window.matchMedia ? window.matchMedia('(max-width: 768px)') : null;
                    mqListener = mq ? (e => { isMobile.value = e.matches; }) : null;
                    if (mq && mq.addEventListener) mq.addEventListener('change', mqListener);
                    else if (mq && mq.addListener) mq.addListener(mqListener);
                    isMobile.value = mq ? mq.matches : (window.innerWidth <= 768);
                });

                const handleAuthClick = () => tokenClient.requestAccessToken();

                const logout = () => {
                    localStorage.removeItem('bq_token');
                    isLoggedIn.value = false;
                    rows.value = [];
                };

                const executeTemplate = async () => {
                    const token = localStorage.getItem('bq_token');
                    if (!token) return;

                    loading.value = true;
                    error.value = null;
                    source_id = params.source_id ? params.source_id : 0
                    try {
                        const response = await fetch(`https://bigquery.googleapis.com/bigquery/v2/projects/${PROJECT_ID}/queries`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                query: "select sources.source_name, recipes.recipe_name, recipes.page, recipes.cooking_time_minutes, recipes.effort_rating, recipes.recipe_id from `recipes-46d2e.recipes.recipes` recipes inner join `recipes-46d2e.recipes.sources` sources on recipes.source_id = sources.source_id" + (source_id == 0 ? '' : " where recipes.source_id = '" + source_id +"'"),
                                useLegacySql: false
                            })
                        });

                        const data = await response.json();

                        if (data.error) {
                            if (data.error.code === 401) logout();
                            else throw new Error(data.error.message);
                        } else {
                            schema.value = data.schema.fields;
                            const mappedRows = data.rows.map(function(row) {
                                return {
                                    source_name: row.f[0]?.v || -1, name: row.f[1]?.v || 'N/A', page: row.f[2]?.v || null, cooking_time_minutes: row.f[3]?.v || -1, effort_rating: row.f[4]?.v || -1, recipe_id: row.f[5]?.v || -1
                                }
                            }) || [];
                            rows.value = mappedRows;
                        }
                    } catch (e) {
                        error.value = e.message;
                    } finally {
                        loading.value = false;
                    }
                };

                onBeforeUnmount(() => {
                    if (mq) {
                        if (mq.removeEventListener) mq.removeEventListener('change', mqListener);
                        else mq.removeListener(mqListener);
                    }
                });

                return { isLoggedIn, loading, error, rows, schema, searchText, handleAuthClick, logout, executeTemplate, isMobile };
            }
        })

        app.use(Quasar)
        Quasar.Lang.set(Quasar.Lang.enGB)
        app.mount('#app')

    </script>

</body>

</html>
